<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="The money moment: agent hits 402, signs payment, facilitator settles on Algorand, hint returns">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080B14"/>
      <stop offset="100%" stop-color="#0B1622"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E3A4C"/>
      <stop offset="100%" stop-color="#2DE2C5"/>
    </linearGradient>
    <filter id="dotglow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <style>
      .node   { animation: lift 6s ease-in-out infinite; }
      .n1 { animation-delay: 0s }   .n2 { animation-delay: 1.2s }
      .n3 { animation-delay: 2.4s } .n4 { animation-delay: 3.6s }
      .n5 { animation-delay: 4.8s }
      @keyframes lift {
        0%, 12%, 100% { opacity: .55 }
        4%, 8%        { opacity: 1 }
      }
      .packet { animation: travel 6s cubic-bezier(.6,.02,.4,.98) infinite; }
      @keyframes travel {
        0%   { transform: translateX(0px);   opacity: 0 }
        6%   { opacity: 1 }
        94%  { opacity: 1 }
        100% { transform: translateX(1010px); opacity: 0 }
      }
      .flash { animation: flash 6s ease-in-out infinite; }
      @keyframes flash { 0%,20%,100% { opacity:.25 } 8%,14% { opacity:1 } }
    </style>
  </defs>

  <rect width="1200" height="300" rx="14" fill="url(#fbg)"/>

  <text x="50" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="3" fill="#5A7189">
    THE MONEY MOMENT — ONE <tspan fill="#F2B14C">await</tspan>, NO HUMAN IN THE PATH
  </text>

  <!-- connectors -->
  <g stroke="url(#wire)" stroke-width="2.5" opacity="0.85">
    <line x1="230" y1="150" x2="280" y2="150"/>
    <line x1="460" y1="150" x2="510" y2="150"/>
    <line x1="690" y1="150" x2="740" y2="150"/>
    <line x1="920" y1="150" x2="970" y2="150"/>
  </g>

  <!-- nodes -->
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <g class="node n1">
      <rect x="50" y="106" width="180" height="88" rx="12" fill="#0F1B2E" stroke="#2DE2C5" stroke-opacity="0.45"/>
      <text x="140" y="142" text-anchor="middle" font-size="16" font-weight="700" fill="#E6F1F5">Agent</text>
      <text x="140" y="168" text-anchor="middle" font-size="12" fill="#7C93A8" font-family="ui-monospace, monospace">confidence low</text>
    </g>
    <g class="node n2">
      <rect x="280" y="106" width="180" height="88" rx="12" fill="#1B1408" stroke="#F2B14C" stroke-opacity="0.65"/>
      <text x="370" y="142" text-anchor="middle" font-size="16" font-weight="700" fill="#F2B14C">HTTP 402</text>
      <text x="370" y="168" text-anchor="middle" font-size="12" fill="#B8925A" font-family="ui-monospace, monospace">payment required</text>
    </g>
    <g class="node n3">
      <rect x="510" y="106" width="180" height="88" rx="12" fill="#0F1B2E" stroke="#2DE2C5" stroke-opacity="0.45"/>
      <text x="600" y="142" text-anchor="middle" font-size="16" font-weight="700" fill="#E6F1F5">Sign + retry</text>
      <text x="600" y="168" text-anchor="middle" font-size="12" fill="#7C93A8" font-family="ui-monospace, monospace">agent's own key</text>
    </g>
    <g class="node n4">
      <rect x="740" y="106" width="180" height="88" rx="12" fill="#0F1B2E" stroke="#2DE2C5" stroke-opacity="0.45"/>
      <text x="830" y="142" text-anchor="middle" font-size="16" font-weight="700" fill="#E6F1F5">Facilitator</text>
      <text x="830" y="168" text-anchor="middle" font-size="12" fill="#7C93A8" font-family="ui-monospace, monospace">verify → settle</text>
    </g>
    <g class="node n5">
      <rect x="970" y="106" width="180" height="88" rx="12" fill="#082018" stroke="#2DE2C5" stroke-opacity="0.75"/>
      <text x="1060" y="142" text-anchor="middle" font-size="16" font-weight="700" fill="#2DE2C5">200 OK</text>
      <text x="1060" y="168" text-anchor="middle" font-size="12" fill="#6FBFA8" font-family="ui-monospace, monospace">hint unlocked</text>
    </g>
  </g>

  <!-- traveling packet -->
  <g class="packet">
    <circle cx="140" cy="150" r="7" fill="#F2B14C" filter="url(#dotglow)" opacity="0.9"/>
    <circle cx="140" cy="150" r="4" fill="#FFE3B0"/>
  </g>

  <!-- footer strip -->
  <text x="50" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5A7189">
    settles on <tspan fill="#2DE2C5">Algorand testnet</tspan> · tx id surfaced in the UI · verifiable on <tspan fill="#2DE2C5">Lora</tspan>
  </text>
  <rect x="50" y="268" width="1100" height="2" fill="#2DE2C5" opacity="0.15" class="flash"/>
</svg>
